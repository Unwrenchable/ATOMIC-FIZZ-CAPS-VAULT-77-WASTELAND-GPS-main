[features]
seeds = false
skip-lint = false

# One program id per cluster. Do not deploy this duplicate.
# localnet is a fresh keypair (gitignored under target/deploy). It must not
# be the canonical repo's localnet (HnWTnCKu…), devnet (GvTeKyGi…), or
# mainnet (DXxzKfZh…).
[programs.localnet]
fizzcaps_onchain = "H2nT8nZcJ1WvLjvZR3EZEYEjxQWiB3LEqeYBY52nkNyZ"

[programs.devnet]
fizzcaps_onchain = "GEoBZ4ReipZW6sZv76TYXqgsziv1NVDtVLnn3E4TpUrk"

# Anchor 0.32 parses this key with Cluster::from_str, which accepts "mainnet"
# and rejects "mainnet-beta". The backend still calls the cluster mainnet-beta.
[programs.mainnet]
fizzcaps_onchain = "CgjmUQQPHeYJHP1wJAqXpnFcSgK58sgxRn7FvKKczsBF"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "bash anchor-tests/scripts/fetch-metadata.sh && npm install --prefix anchor-tests && NODE_PATH=anchor-tests/node_modules npx --prefix anchor-tests ts-mocha -p anchor-tests/tsconfig.json -t 1000000 anchor-tests/tests/**/*.ts"
test-root = "npm test"

[test]
# claim_loot's upgrade-authority gate reads ProgramData. A non-upgradeable
# --bpf-program has no ProgramData account, so the suite loads this program
# as upgradeable with the provider wallet as the upgrade authority.
upgradeable = true

[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "anchor-tests/fixtures/mpl_token_metadata.so"
