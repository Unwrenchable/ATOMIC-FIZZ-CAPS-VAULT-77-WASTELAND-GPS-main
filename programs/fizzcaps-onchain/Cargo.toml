[package]
name = "fizzcaps_onchain"
version = "0.1.0"
description = "Atomic Fizz Caps — $CAPS token + real-world loot NFT claims"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fizzcaps_onchain"

[features]
# Exactly one cluster feature must be passed at build time. There is
# intentionally no default cluster (do not set default = ["localnet"]).
#   cargo test -p fizzcaps_onchain --features localnet
#   anchor build -- --features devnet
#   anchor build -- --features mainnet
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
localnet = []
devnet = []
mainnet = []

# These silence common Anchor + solana-program check-cfg warnings (very common in 2025)
# You can remove them if you prefer #![allow(unexpected_cfgs)] in lib.rs instead
custom-heap    = []
custom-panic   = []
anchor-debug   = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.32"
anchor-spl = "0.32"  # without metadata feature
mpl-token-metadata = "5.1.1"  # latest stable as of Dec 2025 (5.1.2 is still alpha)
# solana-program 2.3 split these out of anchor_lang::solana_program.
solana-sdk-ids = "2.2"
solana-sha256-hasher = "2.3"

[dev-dependencies]
ed25519-dalek = "2"
solana-program-option = "2.2"
solana-program-pack = "2.2"
solana-program-test = "2.3"
solana-sdk = "2.3"
spl-token = "8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }